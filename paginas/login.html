<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f9fa">
    <title>Entrar | Prot&oacute;tipo Parada Inteligente</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-body">
    <main class="login-card">
        <section class="login-form-side">
            <div class="login-brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M5 16.5V6.8A2.8 2.8 0 0 1 7.8 4h8.4A2.8 2.8 0 0 1 19 6.8v9.7M5 11h14M7.5 16.5v2m9-2v2M7.8 19h8.4M8 7.5h8"/></svg>
                </span>
                <span>PROTÓTIPO PARADA INTELIGENTE</span>
            </div>
            <h1 class="login-title">Acesse o sistema</h1>
            <p class="login-copy">Demonstra&ccedil;&atilde;o acad&ecirc;mica. Linhas, pontos no mapa e partidas s&atilde;o dados de refer&ecirc;ncia; n&atilde;o h&aacute; previs&atilde;o em tempo real.</p>
            <form class="login-form" id="form-login">
                <label for="senha">Senha de acesso</label>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                <p class="login-error" id="mensagem-erro" role="alert" aria-live="polite"></p>
                <button class="login-submit" type="submit">Entrar no sistema</button>
            </form>
        </section>
        <aside class="login-art" aria-label="Mapa ilustrado de Erechim">
            <svg class="login-art-map" viewBox="0 0 600 500" aria-hidden="true">
                <path d="M-20 90 C110 40 95 200 220 154 S380 62 620 132M-30 235 C90 188 160 298 280 247 S448 183 620 258M-20 392 C100 326 174 424 287 365 S457 320 630 390" fill="none" stroke="#75a7e8" stroke-width="18" stroke-linecap="round" opacity=".48"/>
                <path d="M84 -20 C125 90 205 125 178 228 S198 382 258 520M344 -20 C295 90 398 166 360 258 S425 390 386 520M540 -20 C456 100 533 216 486 300 S500 410 565 520" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity=".82"/>
                <path d="M82 322 C175 254 256 295 315 223 S421 151 500 106" fill="none" stroke="#ea7b16" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>
                <circle cx="82" cy="322" r="12" fill="#16865f" stroke="#ffffff" stroke-width="5"/>
                <circle cx="500" cy="106" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="5"/>
            </svg>
            <div class="login-art-copy"><strong>Mobiliário Urbano Inteligente e Abrigo de Ônibus Inteligente</strong></div>
        </aside>
    </main>
    <script src="../js/login.js"></script>
</body>
</html>
